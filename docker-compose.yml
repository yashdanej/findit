services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ./apps/api/.env
    environment:
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: findit
      MYSQL_USER: root
      MYSQL_PASSWORD: Yash@1212888
      QDRANT_URL: http://qdrant:6333
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_workspace_node_modules:/app/apps/api/node_modules
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    ports: ["5173:5173"]
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_workspace_node_modules:/app/apps/web/node_modules
    depends_on:
      api:
        condition: service_started
  user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    ports: ["5174:5174"]
    volumes:
      - .:/app
      - user_web_node_modules:/app/node_modules
      - user_web_workspace_node_modules:/app/apps/user-web/node_modules
    depends_on:
      api:
        condition: service_started
  # mysql:
  #   image: mysql:8.4
  #   environment:
  #     MYSQL_DATABASE: findit
  #     MYSQL_USER: findit
  #     MYSQL_PASSWORD: findit
  #     MYSQL_ROOT_PASSWORD: local-root-password
  #   ports: ["3306:3306"]
  #   volumes: [mysql_data:/var/lib/mysql]
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: findit
      MYSQL_ROOT_PASSWORD: Yash@1212888
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pYash@1212888"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mysql_data:
  qdrant_data:
  api_node_modules:
  api_workspace_node_modules:
  web_node_modules:
  web_workspace_node_modules:
  user_web_node_modules:
  user_web_workspace_node_modules:
